; cnc-ddraw configuration tuned for Gangsters: Organized Crime.
; Full documentation: https://github.com/FunkyFr3sh/cnc-ddraw
[ddraw]
width=640
height=480
; Borderless fullscreen, scaled to the monitor while keeping the 4:3 aspect ratio.
fullscreen=false
windowed=true
border=true
maintas=true
vsync=false
; Smooth upscaling. Other options in the Shaders folder, e.g. Shaders\interpolation\bilinear.glsl or
; Shaders\nearest-neighbor.glsl for sharp pixels.
shader=Shaders\interpolation\catmull-rom-bilinear.glsl
renderer=auto
adjmouse=true
; Child-window handling is done by the Gangsters shim (DSETUP.dll), so cnc-ddraw's own must stay off.
fixchilds=0
nonexclusive=true
singlecpu=false
resolutions=0
hook=4
savesettings=0
toggle_borderless=false
toggle_upscaled=false


no_dinput_hook=false

devmode=true

hook_peekmessage=true

maxfps=60


